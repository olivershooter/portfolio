name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The tests render the page in headless Chrome, which ubuntu-latest already has
      - run: ./gradlew --no-daemon jsTest
